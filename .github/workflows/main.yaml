name: Deploy
on:
  workflow_dispatch:
  push:
    branches: [development]

jobs:
  Build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Build docker
        run: |
          #rm -f .env
          #printf "BASE_URL=https://api.neyron.ai/" > .env
          docker build -t legalens-beta-web .
          docker stop legalens-beta-web  || true
          docker rm legalens-beta-web || true
          docker run -p 3004:3000 -d --name=legalens-beta-web legalens-beta-web
